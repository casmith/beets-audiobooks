name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release tag
      packages: write   # push to ghcr.io

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: amd64,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Get next version
      id: version
      uses: thenativeweb/get-next-version@d5e0026f4595af03fe9d57acb3e589c9d42b081b # 2.8.3
      with:
        prefix: 'v'

    # Publish only from main, and only when the commits since the last tag
    # warrant a new version, so a deployed tag is never overwritten.
    - name: Decide whether to publish
      id: publish
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ steps.version.outputs.hasNextVersion }}" == "true" ]]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
        echo "next version: ${{ steps.version.outputs.version }} (hasNextVersion=${{ steps.version.outputs.hasNextVersion }}, event=${{ github.event_name }})"

    # Smoke test on amd64 before anything is pushed: the plugins our config
    # loads must import, and beets must start. The linuxserver entrypoint is
    # the s6 supervisor, so bypass it.
    - name: Build test image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        load: true
        tags: beets-audiobooks:test
        platforms: linux/amd64

    - name: Smoke test
      run: |
        docker run --rm --entrypoint sh beets-audiobooks:test -c '
          set -e
          mkdir -p /tmp/beets
          printf "library: /tmp/beets/library.db\nplugins: audible filetote fromfilename scrub hook\nmusicbrainz:\n  enabled: no\n" > /tmp/beets/config.yaml
          BEETSDIR=/tmp/beets beet version
          BEETSDIR=/tmp/beets beet version | grep -q "plugins: audible, filetote, fromfilename, hook, scrub"
          python3 -c "import PIL; print(\"Pillow\", PIL.__version__)"
        '

    - name: Login to GHCR
      if: steps.publish.outputs.enabled == 'true'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: ${{ steps.publish.outputs.enabled == 'true' }}
        tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        platforms: linux/amd64,linux/arm64
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.licenses=MIT

    - name: Tag release
      if: steps.publish.outputs.enabled == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git tag "$VERSION"
        git push origin "$VERSION"
